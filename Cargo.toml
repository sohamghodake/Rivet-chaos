[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bollard = "0.21"
chaos-checker = { path = "crates/chaos-checker" }
chaos-core = { path = "crates/chaos-core" }
chaos-driver = { path = "crates/chaos-driver" }
chaos-history = { path = "crates/chaos-history" }
chaos-nemesis = { path = "crates/chaos-nemesis" }
chaos-report = { path = "crates/chaos-report" }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hdrhistogram = "7"
jiff = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rivetkit-client = "=3.0.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
