global
	log stdout format raw local0

# Docker's DNS, so a restarted instance is found again.
resolvers docker
	nameserver dns 127.0.0.11:53
	hold valid 1s

defaults
	mode http
	log global
	option httplog
	timeout connect 5s
	# Rivet's VM guide asks for one-hour idle timeouts on every proxy.
	timeout client 1h
	timeout server 1h
	timeout tunnel 1h
	# Only connection failures are retried: the request never reached an
	# instance, so retrying can't apply it twice.
	retries 3
	retry-on conn-failure
	option redispatch

frontend rivet
	bind :6420
	default_backend engines

backend engines
	balance roundrobin
	option httpchk GET /health
	http-check expect status 200
	default-server check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
	server engine-1 engine-1:6420
	server engine-2 engine-2:6420
	server engine-3 engine-3:6420
