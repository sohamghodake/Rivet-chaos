# F7: cut the bucket off the `storage` network for two minutes. The bucket
# isn't on the write path, so writes should keep being acknowledged.
name = "bucket-outage"
seed = 42
duration_s = 300

[workload]
ledgers = 50
processes = 16
pacing_ms = [50, 200]
call_timeout_ms = 5000
agent_sessions = 10

[[nemesis]]
fault = "disconnect"
target = "s3"
network = "storage"
at_s = 60
heal_after_s = 120

[checks]
quiesce_s = 30
recovery_deadline_s = 300
