# F4: SIGKILL one node, start it again 30 s later. Its actors should restart on
# the other node with their state intact. Repeats every two minutes.
name = "node-crash"
seed = 42
duration_s = 300

[workload]
ledgers = 50
processes = 16
pacing_ms = [50, 200]
call_timeout_ms = 5000
agent_sessions = 10

[[nemesis]]
fault = "kill"
target = ["node-a", "node-b"]
at_s = 60
heal_after_s = 30
repeat_every_s = 120

[checks]
quiesce_s = 30
recovery_deadline_s = 300
