# F3: permanent instance loss. Kill one instance, delete its container and log
# volume, and 30 s later start a fresh one in its place. The run is long enough
# for the replicas to be rebuilt, which the docs put at about two minutes.
name = "instance-replace"
seed = 42
duration_s = 420

[workload]
ledgers = 50
processes = 16
pacing_ms = [50, 200]
call_timeout_ms = 5000
agent_sessions = 10

[[nemesis]]
fault = "replace"
target = ["engine-1", "engine-2", "engine-3"]
at_s = 60
heal_after_s = 30

[checks]
quiesce_s = 30
recovery_deadline_s = 300
