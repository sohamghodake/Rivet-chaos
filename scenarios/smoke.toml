# A minute-long check that the whole pipeline works, from cluster up to report.
name = "smoke"
seed = 1
duration_s = 60

[workload]
ledgers = 10
processes = 8
pacing_ms = [50, 200]
call_timeout_ms = 5000

[[nemesis]]
fault = "kill"
target = "engine-2"
at_s = 20
heal_after_s = 15

[checks]
quiesce_s = 10
recovery_deadline_s = 120
