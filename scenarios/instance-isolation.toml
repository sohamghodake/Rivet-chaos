# F6: cut one instance off the `peer` network for 60 s. It still takes client
# and node traffic on `front`, but on its own it can't reach a quorum, so it must
# not acknowledge writes.
name = "instance-isolation"
seed = 42
duration_s = 300

[workload]
ledgers = 50
processes = 16
pacing_ms = [50, 200]
call_timeout_ms = 5000
agent_sessions = 10

[[nemesis]]
fault = "disconnect"
target = ["engine-1", "engine-2", "engine-3"]
network = "peer"
at_s = 60
heal_after_s = 60
repeat_every_s = 150

[checks]
quiesce_s = 30
recovery_deadline_s = 300
